[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# G004: no f-strings in log calls, so a log template never holds a value (diagnostics feed, ADR-0013).
select = ["E", "F", "I", "B", "UP", "G004"]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations.
"*/migrations/*" = ["E501"]
# Ported legacy tests keep the legacy test name and Persian expectations verbatim.
"tests/ported/*" = ["E501"]

[tool.bandit]
# assert is used only to narrow types for mypy after a check that already holds; no behaviour depends on it, and the
# image never runs Python with -O.
skips = ["B101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^tests/"]

[tool.django-stubs]
django_settings_module = "klerk.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "klerk.settings.test"
testpaths = ["tests"]
